name: Project Euler language validation

on:
  pull_request:
    branches: [reorganize/solutions-by-language]
    paths:
      - 'solutions/**'
      - 'support/**'
      - 'tests/**'
      - 'scripts/**'
      - 'explanations/latex/**'
      - 'Makefile'
      - '.github/workflows/euler-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: euler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: C, Rust and Forth on one machine
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install language and documentation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gforth libgmp-dev python3-venv texlive-latex-recommended lmodern
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check numpy matplotlib
          rustup default stable
      - name: Check runner and native helpers (not full solution warm-ups)
        run: |
          make unit-c unit-forth unit-python PYTHON=.venv/bin/python
          cargo test --release --lib --manifest-path solutions/rust/Cargo.toml -- --skip small_problems
      - name: Build optimized executables
        run: make c-release rust-release
      - name: Validate and profile each of the 111 solutions exactly once
        id: profile
        continue-on-error: true
        run: make profile PYTHON=.venv/bin/python
      - name: Generate mathematical figures
        run: make plots-math PYTHON=.venv/bin/python
      - name: Compile exact repository LaTeX with red corrections
        run: make docs
      - name: Preserve measurements, plots, PDF, TeX sources and dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: euler-validation-${{ github.run_id }}
          path: |
            build/profile/
            build/math_plots/
            explanations/latex/build/*.pdf
            explanations/latex/*.tex
            explanations/latex/chapters/*.tex
            solutions/rust/Cargo.lock
          if-no-files-found: warn
          retention-days: 30
      - name: Fail the check when an answer, timeout, or plotting check failed
        if: steps.profile.outcome == 'failure'
        run: exit 1
